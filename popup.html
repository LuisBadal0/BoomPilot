<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoomPilot</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f6f2; --surface:#fff; --text:#28251d; --muted:#6b6a66; --primary:#01696f; --border:#d8d5cf; --danger:#7a1f1f; }
    @media (prefers-color-scheme: dark) { :root { --bg:#171614; --surface:#1c1b19; --text:#ece9e2; --muted:#aaa59a; --primary:#4f98a3; --border:#3a3834; --danger:#b65353; } }
    * { box-sizing: border-box; }
    body { margin:0; width:320px; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--text); padding:16px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; }
    h1 { font-size:18px; margin:0 0 6px; }
    h2 { font-size:13px; margin:16px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    p { margin:0 0 12px; color:var(--muted); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    input[type="range"] { width:100%; accent-color:var(--primary); }
    .value { font-weight:700; min-width:60px; text-align:right; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    button { border:0; border-radius:10px; padding:10px 12px; color:#fff; font-weight:600; cursor:pointer; }
    #reset { background:var(--primary); }
    #mute { background:var(--danger); }
    .tab-list { display:grid; gap:8px; max-height:180px; overflow:auto; }
    .tab-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:color-mix(in srgb, var(--surface) 85%, transparent); }
    .tab-main { min-width:0; }
    .tab-title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
    .tab-url { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px; }
    .pill { font-size:12px; font-weight:700; color:#fff; background:var(--primary); border-radius:999px; padding:4px 8px; }
    .empty { color:var(--muted); font-size:13px; padding:10px 2px 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BoomPilot</h1>
    <p>Steer the volume of the current tab.</p>
    <div class="row"><label for="volume">Level</label><div id="value" class="value">100%</div></div>
    <input id="volume" type="range" min="0" max="500" step="1" value="100">
    <div class="actions">
      <button id="reset">Reset</button>
      <button id="mute">Mute</button>
    </div>
    <h2>Changed tabs</h2>
    <div id="changedTabs" class="tab-list"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
